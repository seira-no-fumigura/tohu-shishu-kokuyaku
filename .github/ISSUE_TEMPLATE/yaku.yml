name: 現代語訳の誤り
description: 現代語訳の誤りや、よりよい現代語訳を知らせる
title: "[訳] 杜少陵詩集（国訳漢文大成） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: tohu-shishu-kokuyaku-0001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの現代語訳
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した現代語訳
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
